<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG 图标集 · Simple</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#1d1d1f;
    --muted:#86868b;
    --accent:#0071e3;
    --border:rgba(0,0,0,.06);
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --card:#1c1c1e;
      --text:#f5f5f7;
      --muted:#8e8e93;
      --accent:#0a84ff;
      --border:rgba(255,255,255,.08);
      --shadow:0 1px 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:48px 24px 80px;
    transition:background .3s;
  }
  .wrap{max-width:960px;margin:0 auto}
  header{margin-bottom:28px}
  h1{
    font-size:28px;
    font-weight:600;
    letter-spacing:-.02em;
    margin:0 0 6px;
  }
  .sub{color:var(--muted);font-size:14px;letter-spacing:.01em}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
    gap:12px;
  }
  .card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:20px 6px 14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    color:var(--text);
    font:inherit;
    cursor:pointer;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),color .22s,box-shadow .22s;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }
  .card:hover,.card:focus-visible{transform:translateY(-3px);color:var(--accent)}
  .card:active{transform:scale(.95)}
  .card.copied{color:var(--accent)}
  .card svg{width:28px;height:28px;display:block}
  .label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
    transition:color .22s;
  }
  .card:hover .label{color:var(--accent)}
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translate(-50%,16px);
    background:rgba(30,30,32,.92);
    color:#fff;
    font-size:13.5px;
    padding:10px 20px;
    border-radius:999px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s cubic-bezier(.2,.8,.2,1);
    z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{margin-top:36px;color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SVG 图标集</h1>
    <p class="sub">点击任意图标即可复制 SVG 代码 · 24×24 · 描边风格</p>
  </header>

  <div class="grid" id="grid">

    <!-- 首页 -->

      <span class="label">删除</span>
    </button>

  <footer>点击图标 → 复制 SVG 代码，可直接粘贴进任何 HTML</footer>
</div>

<div class="toast" id="toast">已复制</div>

<script>
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function copyText(text){
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); resolve(); }
      catch (e) { reject(e); }
      finally { document.body.removeChild(ta); }
    });
  }

  document.getElementById('grid').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;

    const svgEl = card.querySelector('svg');
    const code = svgEl.outerHTML;

    copyText(code).then(() => {
      showToast(`已复制「${card.dataset.name}」`);
      card.classList.add('copied');
      setTimeout(() => card.classList.remove('copied'), 700);
    }).catch(() => {
      showToast('复制失败，请手动选择');
    });
  });
</script>
</body>
