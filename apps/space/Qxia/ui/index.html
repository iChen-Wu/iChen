<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qxia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f5f7fb; color: #1f2937;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { max-width: 480px; width: 90%; background: #fff; border-radius: 14px;
          padding: 24px 26px; box-shadow: 0 2px 12px rgba(15,23,42,.08); text-align: center; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .desc { color: #6b7280; font-size: 13px; line-height: 1.7; }
  .badge { display: inline-block; margin-top: 14px; padding: 4px 12px; border-radius: 20px;
           background: #f3f4f6; color: #9aa4b2; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Qxia</h1>
    <div class="desc">
      全插件智能体运行侧（极薄 kernel + 插件化 + 声明式流程）。<br>
      这是早期产物，当前版本暂不能在中枢内运行。<br>
      仅作占位展示，后续会更新为可用版本。
    </div>
    <div class="badge">早期产物 · 暂不可用</div>
  </div>
